services:
  bot:
    build: .
    command: ["python", "run.py"]
    env_file:
      - .env
    depends_on:
      - database

  api:
    build: .
    command: ["uvicorn", "app.api.routes:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - database

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: security_scanner
      POSTGRES_USER: security
      POSTGRES_PASSWORD: security
    ports:
      - "5432:5432"
