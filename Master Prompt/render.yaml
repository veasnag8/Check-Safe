services:
  - type: web
    name: telegram-security-scanner-api
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_PATH
        value: /telegram/webhook
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
