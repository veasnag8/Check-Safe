services:
  - type: web
    name: telegram-security-scanner-api
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health

  - type: worker
    name: telegram-security-scanner-bot
    runtime: docker
    plan: starter
    autoDeploy: true
    dockerCommand: python run.py --mode bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
